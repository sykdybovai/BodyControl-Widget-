name: Install and Build BodyControl

on:
  push:
    paths:
      - "BodyControlWidget-BodyControl-FullUI-1.3.0.zip"
      - ".github/workflows/install-and-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -e
          ZIP="BodyControlWidget-BodyControl-FullUI-1.3.0.zip"
          test -f "$ZIP"

          rm -rf _extract
          mkdir _extract
          unzip -q "$ZIP" -d _extract

          ROOT="$PWD/_extract"
          if [ ! -f "$ROOT/settings.gradle.kts" ] && [ ! -f "$ROOT/settings.gradle" ]; then
            FOUND="$(find "$ROOT" -mindepth 1 -maxdepth 3 -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
            test -n "$FOUND"
            ROOT="$(dirname "$FOUND")"
          fi

          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name ".github"             ! -name "BodyControlWidget-BodyControl-FullUI-1.3.0.zip"             ! -name "_extract"             -exec rm -rf {} +

          cp -a "$ROOT"/. .

          test -f settings.gradle.kts -o -f settings.gradle
          test -d app

      - name: Commit installed project
        shell: bash
        run: |
          rm -rf _extract
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- BodyControlWidget-BodyControl-FullUI-1.3.0.zip .github/workflows/install-and-build.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "Install BodyControl project from archive"
            git push
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BodyControl-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
